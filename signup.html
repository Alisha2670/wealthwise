<!DOCTYPE html>
<html lang="en">
<!-- Meta & Stylesheets -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign up for WealthWise - Personal Finance Dashboard">
    <title>Sign up for WealthWise</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Local CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
    <!-- Background Accents -->
    <div class="auth-background">
        <div class="auth-shape shape-1"></div>
        <div class="auth-shape shape-2"></div>
    </div>
    <!-- Auth Card -->
    <div class="auth-container animate-fade-in">
        <!-- Logo & Title -->
        <div class="auth-header">
            <a href="index.html" class="auth-logo">
                <i class="fa-solid fa-chart-pie"></i>
                WealthWise
            </a>
            <h1 class="auth-title">Create an account</h1>
            <p class="auth-subtitle">Start your journey to financial intelligence.</p>
        </div>
         <!-- Registration Form -->
        <div class="auth-card animate-slide-up delay-100">
            <form action="dashboard.html" class="auth-form">
                <div class="form-group">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Full Name" required>
                </div>
                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Create a strong password" required>
                </div>
                <div class="auth-options">
                    <label class="checkbox-label" style="font-size: var(--font-size-xs);">
                        <input type="checkbox" required> I agree to the <a href="#" class="forgot-link">Terms of Service</a> & <a href="#" class="forgot-link">Privacy Policy</a>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary auth-submit">
                    Create Account
                </button>
            </form>
            <!-- Login Link -->
            <div class="auth-footer">
                Already have an account? <a href="login.html">Log in</a>
            </div>
        </div>
    </div>
     <!-- Scripts -->
    <script src="js/helpers.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
