<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to WealthWise - Personal Finance Dashboard">
    <title>Log in to WealthWise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
    <div class="auth-background">
        <div class="auth-shape shape-1"></div>
        <div class="auth-shape shape-2"></div>
    </div>
    <div class="auth-container animate-fade-in">
        <div class="auth-header">
            <a href="index.html" class="auth-logo">
                <i class="fa-solid fa-chart-pie"></i>
                WealthWise
            </a>
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Enter your details to access your dashboard.</p>
        </div>
        <div class="auth-card animate-slide-up delay-100">
            <form action="dashboard.html" class="auth-form">
                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                </div>
                <!-- <div class="auth-options">
                    <label class="checkbox-label">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div> -->
                <button type="submit" class="btn btn-primary auth-submit">
                    Sign In
                </button>
            </form>
            <div class="auth-footer">
                Don't have an account? <a href="signup.html">Sign up for free</a>
            </div>
        </div>
    </div>
    <script src="js/helpers.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
